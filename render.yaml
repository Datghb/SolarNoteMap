services:
  - type: web
    name: solar-note-map
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: qwen/qwen3.6-27b
      - key: GROQ_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_ADAPTIVE_QUIZ_ENABLED
        value: false
      - key: ADAPTIVE_QUIZ_ENABLED
        value: false
